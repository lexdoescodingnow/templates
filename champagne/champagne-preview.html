const frames=['light','dark'].map(mode=>({mode,node:document.getElementById(mode+'-frame'),observer:null}));
function selectedDesign(){return designs[document.getElementById('design').value]}

document.getElementById('width').addEventListener('click',e=>{const active=document.getElementById('grid').classList.toggle('narrow');e.currentTarget.setAttribute('aria-pressed',active);e.currentTarget.textContent=active?'Show full width':'Try narrow width'});
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(selectedDesign().snippet);document.getElementById('status').textContent='Snippet copied'}catch{document.getElementById('source-panel').open=true;document.getElementById('source').select();document.getElementById('status').textContent='Code selected — copy with Ctrl/Cmd+C'}});
