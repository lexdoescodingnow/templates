.ft-footer {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
}

.ft-now {
  justify-content: center;
}

.ft-now span,
.ft-react-button {
  border-color: var(--ft-line);
  background: var(--ft-panel-soft);
  color: var(--ft-muted);
  backdrop-filter: none;
}

.ft-dialogue {
  display: grid;
  gap: 9px;
  padding: 15px 16px;
  border: 1px solid var(--ft-line);
  border-radius: 18px;
  background: rgba(0, 0, 0, 0.24);
  text-align: left;
}

.ft-dialogue p {
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--ft-ink);
  font-size: 13px;
  overflow-wrap: anywhere;
}

.ft-react-button {
  min-height: 24px;
  padding: 6px 9px;
  font-size: 8px;
}

@media (max-width: 430px) {
  .ft-social-template {
    margin: 24px auto;
  }

  .ft-top,
  .ft-footer {
    align-items: flex-start;
    flex-direction: column;
  }

  .ft-meta {
    justify-items: start;
  }

  .ft-screen {
    min-height: 520px;
  }

  .ft-pip {
    width: 98px;
  }

}
