<style>.bh-character-directory{--pc-paper:#faf9f7;--pc-card:#fff;--pc-ink:#303035;--pc-muted:#707078;--pc-line:#dedde0;--pc-one:rgb(var(--mgrgb1,95,95,105));--pc-two:rgb(var(--mgrgb2,125,125,135));--pc-three:rgb(var(--mgrgb3,80,80,90));box-sizing:border-box;display:block;width:660px;max-width:100%;min-width:0;margin:24px auto;padding:24px;border:1px solid var(--pc-line);border-top:3px solid var(--pc-one);border-radius:14px;background:var(--pc-paper);color:var(--pc-ink);font:400 13px/1.6 Arial,sans-serif;text-align:left;color-scheme:light;}
.bh-character-directory *{box-sizing:border-box;}
.bh-character-directory [hidden]{display:none!important;}
.bh-character-directory .pc-kicker{display:block;margin:0 0 5px;color:var(--pc-muted);font:600 10px/1.5 Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;}
.bh-character-directory h2.pc-title{margin:0;padding:0;border:0;background:none;color:var(--pc-one);font:400 30px/1.2 Georgia,serif;letter-spacing:-.7px;text-transform:none;}
.bh-character-directory .pc-search{display:flex;gap:8px;margin:18px 0 12px;}
.bh-character-directory .pc-search label{flex:1;min-width:0;}
.bh-character-directory .pc-input{display:block;appearance:none;width:100%;min-height:44px;margin:0;padding:11px 13px;border:1px solid var(--pc-line);border-radius:7px;background:var(--pc-card);color:var(--pc-ink);font:400 13px/1.5 Arial,sans-serif;}
.bh-character-directory .pc-input::placeholder{color:var(--pc-muted);opacity:1;}
.bh-character-directory .pc-count{margin:12px 0;color:var(--pc-muted);font:400 11px/1.5 Arial,sans-serif;}
.bh-character-directory .pc-list{display:grid;gap:12px;max-height:510px;padding:3px 8px 3px 3px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--pc-one) var(--pc-paper);}
.bh-character-directory .pc-card{display:flex;flex-direction:column;gap:14px;min-width:0;margin:0;padding:17px;border:1px solid var(--pc-line);border-left:2px solid var(--pc-two);border-radius:9px;background:var(--pc-card);}
.bh-character-directory .pc-identity{display:flex;align-items:center;flex-wrap:wrap;gap:14px;}
.bh-character-directory .pc-images{display:flex;gap:7px;max-width:100%;}
.bh-character-directory .pc-photo{display:block;flex:none;width:65px;height:82px;object-fit:cover;object-position:center top;margin:0;padding:0;border:1px solid var(--pc-one);border-radius:6px;}
.bh-character-directory .pc-gif{width:105px;border-color:var(--pc-three);}
.bh-character-directory .pc-person{flex:1;min-width:155px;}
.bh-character-directory h3.pc-name{margin:0 0 6px;padding:0;border:0;background:none;color:var(--pc-one);font:600 18px/1.3 Arial,sans-serif;letter-spacing:0;text-transform:none;}
.bh-character-directory .pc-description{margin:0;padding:0;color:var(--pc-muted);font:400 12px/1.7 Arial,sans-serif;overflow-wrap:anywhere;}
.bh-character-directory .pc-actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px;}
.bh-character-directory button{appearance:none;min-height:42px;margin:0;padding:10px 14px;border:1px solid var(--pc-one);border-radius:7px;background:var(--pc-card);color:var(--pc-ink);font:600 11px/1.5 Arial,sans-serif;letter-spacing:.2px;text-transform:none;cursor:pointer;}
.bh-character-directory button:hover{border-color:var(--pc-three);background:linear-gradient(110deg,rgba(var(--mgrgb1,95,95,105),.09),rgba(var(--mgrgb3,80,80,90),.09)),var(--pc-card);}
.bh-character-directory .pc-status{color:var(--pc-muted);font:400 11px/1.5 Arial,sans-serif;}
.bh-character-directory details{display:block;min-width:0;margin:0;padding:0;}
.bh-character-directory summary{display:list-item;color:var(--pc-muted);font:400 11px/1.6 Arial,sans-serif;cursor:pointer;}
.bh-character-directory .pc-code{display:block;width:100%;min-height:120px;margin:10px 0 0;padding:12px;resize:vertical;border:1px solid var(--pc-line);border-radius:6px;background:var(--pc-paper);color:var(--pc-ink);font:400 11px/1.6 monospace;text-align:left;}
.bh-character-directory .pc-empty{margin:0;padding:24px 12px;color:var(--pc-muted);text-align:center;}
.bh-character-directory :is(button,input,textarea,summary):focus-visible{outline:2px solid var(--pc-three);outline-offset:3px;}
.bh-character-directory :is(b,strong,u){color:var(--pc-one);}
.bh-character-directory :is(i,em){color:var(--pc-three);}
.bh-character-directory u{text-decoration-color:var(--pc-one);text-underline-offset:3px;}
@supports (background-clip:text) or (-webkit-background-clip:text){.bh-character-directory h2.pc-title,.bh-character-directory :is(b,strong,u){background-image:linear-gradient(110deg,var(--pc-one),var(--pc-two),var(--pc-three));background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}.bh-character-directory :is(i,em){background-image:linear-gradient(110deg,var(--pc-three),var(--pc-two),var(--pc-one));background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}}
html[color-mode='dark'] .bh-character-directory{--pc-paper:#202023;--pc-card:#28282c;--pc-ink:#eeeef1;--pc-muted:#bcbcc4;--pc-line:#424248;--pc-one:rgb(var(--mgrgb1,195,195,205));--pc-two:rgb(var(--mgrgb2,180,180,190));--pc-three:rgb(var(--mgrgb3,215,215,225));color-scheme:dark;}
@media(prefers-color-scheme:dark){html:not([color-mode]) .bh-character-directory{--pc-paper:#202023;--pc-card:#28282c;--pc-ink:#eeeef1;--pc-muted:#bcbcc4;--pc-line:#424248;--pc-one:rgb(var(--mgrgb1,195,195,205));--pc-two:rgb(var(--mgrgb2,180,180,190));--pc-three:rgb(var(--mgrgb3,215,215,225));color-scheme:dark;}}
@media(max-width:420px){.bh-character-directory{padding:18px;}.bh-character-directory h2.pc-title{font-size:26px;}}
@media(forced-colors:active){.bh-character-directory h2.pc-title,.bh-character-directory :is(b,strong,u,i,em){background:none;color:CanvasText;-webkit-text-fill-color:CanvasText;}}

<script>(function(){
var root=document.currentScript.closest('.bh-character-directory');
var records=JSON.parse(root.querySelector('.pc-data').textContent);
var list=root.querySelector('.pc-list');
var input=root.querySelector('.pc-input');
var count=root.querySelector('.pc-count');
var empty=root.querySelector('.pc-empty');
function make(tag,cls,text){var el=document.createElement(tag);el.className=cls;if(text!==undefined)el.textContent=text;return el;}
function plain(value){return value.replace(/\[\/?[a-z][^\]]*\]/gi,'');}
function description(value){var result=make('p','pc-description');var stack=[result];value.split(/(\[\/?(?:b|i|u)\])/gi).forEach(function(part){var tag=/^\[(\/?)(b|i|u)\]$/i.exec(part);if(!tag){stack[stack.length-1].append(document.createTextNode(plain(part)));return;}var name=tag[2].toLowerCase();if(!tag[1]){var el=document.createElement(name);stack[stack.length-1].append(el);stack.push(el);}else if(stack.length>1&&stack[stack.length-1].tagName.toLowerCase()===name){stack.pop();}});return result;}
function words(value){return value.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(function(word){return word&&word!=='and';});}
function fields(value){var result={};var re=/\[(PI|PG|CD|CN)=([\s\S]*?)\](?=\s*(?:\[(?:PI|PG|CD|CN)=|$))/g;var match;while((match=re.exec(value))!==null)result[match[1]]=match[2];return result;}
records.sort(function(a,b){return a.name.localeCompare(b.name,'en',{sensitivity:'base'});});
var cards=records.map(function(record){
var parts=fields(record.code);
var card=make('article','pc-card');
var identity=make('div','pc-identity');
var images=make('div','pc-images');
['PI','PG'].forEach(function(key){var url=parts[key];if(!url||!/^https?:\/\//i.test(url))return;var img=make('img','pc-photo'+(key==='PG'?' pc-gif':''));img.src=url;img.alt=record.name+(key==='PG'?' GIF':' portrait');img.loading='lazy';img.addEventListener('error',function(){img.remove();if(!images.children.length)images.remove();});images.append(img);});
if(images.children.length)identity.append(images);
var person=make('div','pc-person');person.append(make('h3','pc-name',record.name),description(parts.CD||''));identity.append(person);card.append(identity);
var actions=make('div','pc-actions');var copy=make('button','pc-copy','Copy PI');copy.type='button';var status=make('span','pc-status','');status.setAttribute('role','status');status.setAttribute('aria-live','polite');actions.append(copy,status);card.append(actions);
var details=make('details','pc-details');var source=make('textarea','pc-code');source.readOnly=true;source.spellcheck=false;source.setAttribute('aria-label',record.name+' complete PI code');source.value=record.code;details.append(make('summary','','View PI code'),source);card.append(details);
copy.addEventListener('click',async function(){try{await navigator.clipboard.writeText(record.code);status.textContent='PI copied.';}catch(error){details.open=true;source.focus();source.select();source.setSelectionRange(0,source.value.length);status.textContent='Selected — press Ctrl+C or ⌘C.';}});
list.append(card);return {element:card,words:words(record.name+' '+plain(parts.CD||'')+' '+(parts.CN||''))};
});
function filter(){var query=words(input.value);var found=0;cards.forEach(function(card){var match=query.every(function(term){return card.words.some(function(word){return term.length===1?word===term:word.indexOf(term)!==-1;});});card.element.hidden=!match;if(match)found++;});count.textContent=query.length?found+' of '+cards.length+' characters':cards.length+' character'+(cards.length===1?'':'s')+' · A–Z';empty.hidden=found!==0;list.hidden=found===0;list.scrollTop=0;}
function clear(){input.value='';filter();input.focus();}
input.addEventListener('input',filter);input.addEventListener('keydown',function(event){if(event.key==='Escape'){event.preventDefault();clear();}});root.querySelector('.pc-clear').addEventListener('click',clear);
root.querySelector('.pc-search').hidden=false;filter();
})();
</script>
